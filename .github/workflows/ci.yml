name: Build and test
on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - name: Verify generated TypeScript contract
        run: |
          cargo run --locked -p matrix-client --example export-types
          git diff --exit-code -- apps/desktop/src/bindings
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run test
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Tauri application (packaging deferred)
        run: npm run tauri -- build --no-bundle
        working-directory: apps/desktop
