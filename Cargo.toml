[workspace]
members = ["crates/matrix-core", "crates/matrix-client", "crates/matrix-daemon", "apps/desktop/src-tauri"]
default-members = ["crates/matrix-core", "crates/matrix-client", "crates/matrix-daemon"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
matrix-core = { path = "crates/matrix-core" }
matrix-client = { path = "crates/matrix-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process", "test-util"] }
ts-rs = "12"
