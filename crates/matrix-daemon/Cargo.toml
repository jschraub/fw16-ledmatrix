[package]
name = "matrix-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
matrix-core.workspace = true
matrix-client.workspace = true
serde_json.workspace = true
serialport = { version = "4", default-features = false }
tempfile = "3"
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power","Win32_System_RemoteDesktop","Win32_System_SystemServices","Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
